# Avvio sul server con l'immagine già pronta, costruita da GitHub:
#   docker compose up -d
# Aggiornamento alla versione più recente:
#   docker compose pull && docker compose up -d
# (Per costruire l'immagine dal codice invece di scaricarla: docker-compose.build.yml)
services:
  bilancio:
    image: ghcr.io/jstplink/bilancio:latest
    container_name: bilancio
    restart: unless-stopped
    ports:
      - "4870:4870"
    environment:
      TZ: Europe/Rome
      # La password di accesso si crea dalla pagina di accesso al primo avvio: fallo subito, finché non esiste chiunque apra il sito può sceglierla.
      # Facoltativo: fissarla qui, al posto di crearla nell'app (ha la precedenza):
      # BILANCIO_PASSWORD: "una-password-lunga"
    volumes:
      # database SQLite e cache OCR: qui stanno tutti i dati (fanne il backup)
      - ./data:/data
      # opzionale: cartella PDF del NAS, se usi un percorso locale come sorgente
      # - /volume1/documenti/casa:/documenti:ro
