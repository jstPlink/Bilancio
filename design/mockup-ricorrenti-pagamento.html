<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyBank · Ricorrenti, targhetta, pagamento e notifica, mockup</title>
<style>
/* Solo tema scuro, solo inchiostro, carta e il rosso dell'app. 393 px CSS = larghezza del telefono. Dati inventati. Niente filetto a sinistra. */
:root{--paper:#121211;--ink:#edeae3;--mute:#9a958b;--hair:#2e2c29;--red:#ff5a2e;
 --f-serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--f-sans:system-ui,"Segoe UI",Roboto,sans-serif;--f-mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace}
*{box-sizing:border-box}h1,p{margin:0}
body{margin:0;padding:24px;background:#6f6b64;font:15px/1.5 var(--f-sans)}
body>h1{font:700 15px var(--f-mono);color:#fff;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
body>p{color:#eee;font-size:13px;margin-bottom:20px;max-width:900px}
.wall{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
figure{margin:0}figcaption{color:#fff;font:700 13px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
figcaption small{display:block;font:400 13px var(--f-sans);text-transform:none;letter-spacing:0;max-width:393px;margin-top:2px;color:#eee}
.phone{width:393px;height:520px;overflow:hidden;background:var(--paper);color:var(--ink);border:1px solid #000;padding:16px}
.lab{font:11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.ser{font-family:var(--f-serif);letter-spacing:-.02em;font-variant-numeric:tabular-nums lining-nums;font-weight:600;white-space:nowrap}
.hero{border-top:2px solid var(--ink);padding:12px 0 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hero .ser{font-size:28px;line-height:1.1;display:block;margin-top:4px}
.r{display:grid;grid-template-columns:54px 1fr auto;gap:0 12px;align-items:center;padding:11px 0;border-top:1px solid var(--hair)}
.d{font:600 22px/1 var(--f-serif);letter-spacing:-.02em}.d small{display:block;margin-top:3px;font:400 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.n{display:flex;align-items:center;gap:8px;font:700 13px var(--f-mono);letter-spacing:.02em;text-transform:uppercase;min-width:0}
.n .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bell{width:14px;height:14px;flex:none;color:var(--red)}
/* il dettaglio sotto il titolo parte dove parte il nome: sotto la targhetta (46 px + 8 di spazio) c'è il rientro */
.m>.s,.m>.pay{padding-left:54px;font-size:13px;color:var(--mute);margin-top:2px}
.pay b{font:600 15px var(--f-serif);color:var(--ink);letter-spacing:-.01em}
.s{font-size:13px;color:var(--mute)}
.a{font:600 22px/1 var(--f-serif);letter-spacing:-.02em;text-align:right;white-space:nowrap}
.tg{display:inline-flex;align-items:center;justify-content:center;flex:none;width:46px;height:20px;border:1px solid var(--hair);color:var(--mute);font:700 11px var(--f-mono);letter-spacing:.06em}
.tg.y{border-color:var(--ink);background:var(--ink);color:var(--paper)}
</style></head><body>
<h1>Ricorrenti · targhetta, pagamento, notifica</h1>
<p>Stile A (targhetta a sinistra del titolo, tutte larghe uguali così i titoli stanno allineati), senza filetto a sinistra. La campanella rossa è la notifica del ricorrente. Dati inventati, solo tema scuro.</p>
<div class="wall">
<figure><figcaption>1 · Dettaglio sotto il titolo<small>La riga sotto («23,83/mese») parte dove parte il nome. L'importo resta a destra.</small></figcaption><div class="phone"><div class="hero"><div><span class="lab">Costo fisso mensile</span><span class="ser">412,90 €</span></div><div style="text-align:right"><span class="lab">Da mettere da parte</span><span class="ser">64,25 €</span></div></div><div class="r"><div class="d">3<small>nov</small></div><div class="m"><div class="n"><span class="tg y">ANNO</span><span class="t">Assicurazione auto</span><svg class="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"/></svg></div><div class=s>23,83/mese</div></div><div class="a">286,00 €</div></div><div class="r"><div class="d">5<small>mensile</small></div><div class="m"><div class="n"><span class="tg">MESE</span><span class="t">Affitto box</span><svg class="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"/></svg></div></div><div class="a">90,00 €</div></div><div class="r"><div class="d">12<small>mensile</small></div><div class="m"><div class="n"><span class="tg">MESE</span><span class="t">Palestra</span></div></div><div class="a">39,90 €</div></div><div class="r"><div class="d">20<small>gen</small></div><div class="m"><div class="n"><span class="tg y">ANNO</span><span class="t">Bollo auto</span><svg class="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"/></svg></div><div class=s>17,50/mese</div></div><div class="a">210,00 €</div></div><div class="r"><div class="d">27<small>mensile</small></div><div class="m"><div class="n"><span class="tg">MESE</span><span class="t">Telefono</span><svg class="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"/></svg></div></div><div class="a">9,99 €</div></div></div></figure>
<figure><figcaption>2 · Importo sotto il titolo<small>L'importo passa sotto il titolo, allineato al nome, seguito dall'equivalente al mese; la colonna di destra sparisce.</small></figcaption><div class="phone"><div class="hero"><div><span class="lab">Costo fisso mensile</span><span class="ser">412,90 €</span></div><div style="text-align:right"><span class="lab">Da mettere da parte</span><span class="ser">64,25 €</span></div></div><div class="r"><div class="d">3<small>nov</small></div><div class="m"><div class="n"><span class="tg y">ANNO</span><span class="t">Assicurazione auto</span><svg class="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"/></svg></div><div class="pay"><b>286,00 €</b> · 23,83/mese</div></div></div><div class="r"><div class="d">5<small>mensile</small></div><div class="m"><div class="n"><span class="tg">MESE</span><span class="t">Affitto box</span><svg class="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"/></svg></div><div class="pay"><b>90,00 €</b></div></div></div><div class="r"><div class="d">12<small>mensile</small></div><div class="m"><div class="n"><span class="tg">MESE</span><span class="t">Palestra</span></div><div class="pay"><b>39,90 €</b></div></div></div><div class="r"><div class="d">20<small>gen</small></div><div class="m"><div class="n"><span class="tg y">ANNO</span><span class="t">Bollo auto</span><svg class="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"/></svg></div><div class="pay"><b>210,00 €</b> · 17,50/mese</div></div></div><div class="r"><div class="d">27<small>mensile</small></div><div class="m"><div class="n"><span class="tg">MESE</span><span class="t">Telefono</span><svg class="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"/></svg></div><div class="pay"><b>9,99 €</b></div></div></div></div></figure>
</div></body></html>
