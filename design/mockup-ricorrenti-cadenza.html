<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyBank · Ricorrenti mensili e annuali, mockup</title>
<style>
/* Solo tema scuro, solo inchiostro, carta e il rosso dell'app. 393 px CSS = larghezza del telefono. Dati inventati. */
:root{--paper:#121211;--ink:#edeae3;--mute:#9a958b;--hair:#2e2c29;--red:#ff5a2e;
 --f-serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--f-sans:system-ui,"Segoe UI",Roboto,sans-serif;--f-mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace}
*{box-sizing:border-box}h1,p{margin:0}
body{margin:0;padding:24px;background:#6f6b64;font:15px/1.5 var(--f-sans)}
body>h1{font:700 15px var(--f-mono);color:#fff;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
body>p{color:#eee;font-size:13px;margin-bottom:20px;max-width:900px}
.wall{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
figure{margin:0}figcaption{color:#fff;font:700 13px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
figcaption small{display:block;font:400 13px var(--f-sans);text-transform:none;letter-spacing:0;max-width:393px;margin-top:2px;color:#eee}
.phone{width:393px;height:640px;overflow:hidden;background:var(--paper);color:var(--ink);border:1px solid #000;padding:16px}
.lab{font:11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.ser{font-family:var(--f-serif);letter-spacing:-.02em;font-variant-numeric:tabular-nums lining-nums;font-weight:600;white-space:nowrap}
.hero{border-top:2px solid var(--ink);padding:12px 0 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hero .ser{font-size:28px;line-height:1.1;display:block;margin-top:4px}
.sec{border-top:2px solid var(--ink);padding:10px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.sec b{font:700 13px var(--f-mono);letter-spacing:.04em;text-transform:uppercase}
.r{display:grid;grid-template-columns:54px 1fr auto;gap:0 12px;align-items:center;padding:11px 0;border-top:1px solid var(--hair)}
.d{font:600 22px/1 var(--f-serif);letter-spacing:-.02em}.d small{display:block;margin-top:3px;font:400 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.n{font:700 13px var(--f-mono);letter-spacing:.02em;text-transform:uppercase}
.s{font-size:13px;color:var(--mute)}
.a{font:600 22px/1 var(--f-serif);letter-spacing:-.02em;text-align:right;white-space:nowrap}.a small{display:block;margin-top:3px;font:400 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.tg{display:inline-flex;align-items:center;height:20px;padding:0 6px;margin-left:6px;border:1px solid var(--hair);color:var(--mute);font:700 11px var(--f-mono);letter-spacing:.06em;vertical-align:1px}
.tg.y{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.r.y{border-left:2px solid var(--ink);padding-left:10px;margin-left:-12px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);margin:4px 0 6px}
.seg span{height:42px;display:flex;align-items:center;justify-content:center;font:700 13px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.seg .on{background:var(--ink);color:var(--paper)}
</style></head><body>
<h1>Ricorrenti · mensili e annuali</h1>
<p>Tre modi per distinguerli. Dati inventati, solo tema scuro. L'importo è sempre la media dei movimenti assegnati.</p>
<div class="wall">

<figure><figcaption>A · Due sezioni<small>Mensili e Annuali separati, ognuno col suo totale. Gli annuali mostrano il mese in grande.</small></figcaption>
<div class="phone">
 <div class="hero"><div><span class="lab">Costo fisso mensile</span><span class="ser">412,90 €</span></div><div style="text-align:right"><span class="lab">Da mettere da parte</span><span class="ser">64,25 €</span></div></div>
 <div class="sec"><b>Mensili · 4</b><span class="lab">ogni mese</span></div>
 <div class="r"><div class="d">5<small>del mese</small></div><div><div class="n">Affitto box</div></div><div class="a">90,00 €</div></div>
 <div class="r"><div class="d">12<small>del mese</small></div><div><div class="n">Palestra</div></div><div class="a">39,90 €</div></div>
 <div class="r"><div class="d">18<small>del mese</small></div><div><div class="n">Internet casa</div></div><div class="a">29,90 €</div></div>
 <div class="r"><div class="d">27<small>del mese</small></div><div><div class="n">Telefono</div></div><div class="a">9,99 €</div></div>
 <div class="sec" style="margin-top:12px"><b>Annuali · 3</b><span class="lab">una volta l'anno</span></div>
 <div class="r"><div class="d">3<small>nov</small></div><div><div class="n">Assicurazione auto</div><div class="s">286,00 € ÷ 12 = 23,83/mese</div></div><div class="a">286,00 €<small>/anno</small></div></div>
 <div class="r"><div class="d">20<small>gen</small></div><div><div class="n">Bollo auto</div><div class="s">= 17,50/mese</div></div><div class="a">210,00 €<small>/anno</small></div></div>
</div></figure>

<figure><figcaption>B · Una lista, targhetta<small>Come le targhette dei movimenti: MESE pieno per i mensili, ANNO per gli annuali; riga annuale con filetto a sinistra.</small></figcaption>
<div class="phone">
 <div class="hero"><div><span class="lab">Costo fisso mensile</span><span class="ser">412,90 €</span></div><div style="text-align:right"><span class="lab">Da mettere da parte</span><span class="ser">64,25 €</span></div></div>
 <div class="r y"><div class="d">3<small>nov</small></div><div><div class="n">Assicurazione auto<span class="tg y">ANNO</span></div><div class="s">23,83/mese</div></div><div class="a">286,00 €</div></div>
 <div class="r"><div class="d">5<small>mensile</small></div><div><div class="n">Affitto box<span class="tg">MESE</span></div></div><div class="a">90,00 €</div></div>
 <div class="r"><div class="d">12<small>mensile</small></div><div><div class="n">Palestra<span class="tg">MESE</span></div></div><div class="a">39,90 €</div></div>
 <div class="r"><div class="d">18<small>mensile</small></div><div><div class="n">Internet casa<span class="tg">MESE</span></div></div><div class="a">29,90 €</div></div>
 <div class="r y"><div class="d">20<small>gen</small></div><div><div class="n">Bollo auto<span class="tg y">ANNO</span></div><div class="s">17,50/mese</div></div><div class="a">210,00 €</div></div>
 <div class="r"><div class="d">27<small>mensile</small></div><div><div class="n">Telefono<span class="tg">MESE</span></div></div><div class="a">9,99 €</div></div>
</div></figure>

<figure><figcaption>C · Interruttore Mensili / Annuali<small>Una sola lista alla volta; la cifra grande in cima segue la scelta.</small></figcaption>
<div class="phone">
 <div class="seg"><span class="on">Mensili · 4</span><span>Annuali · 3</span></div>
 <div class="hero"><div><span class="lab">Costo fisso mensile</span><span class="ser">412,90 €</span></div><div style="text-align:right"><span class="lab">Pagamenti</span><span class="ser">4</span></div></div>
 <div class="r"><div class="d">5<small>del mese</small></div><div><div class="n">Affitto box</div></div><div class="a">90,00 €</div></div>
 <div class="r"><div class="d">12<small>del mese</small></div><div><div class="n">Palestra</div></div><div class="a">39,90 €</div></div>
 <div class="r"><div class="d">18<small>del mese</small></div><div><div class="n">Internet casa</div></div><div class="a">29,90 €</div></div>
 <div class="r"><div class="d">27<small>del mese</small></div><div><div class="n">Telefono</div></div><div class="a">9,99 €</div></div>
</div></figure>

</div></body></html>
